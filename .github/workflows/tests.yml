name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Catch2
        run: sudo apt-get update && sudo apt-get install -y catch2

      - name: Configure
        run: cmake -B build -S test -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./run_tests -s

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y catch2 lcov

      - name: Configure
        run: cmake -B build -S test -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=OFF -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Generate coverage report
        working-directory: build
        run: cmake --build . --target coverage

      - name: Generate coverage badge
        working-directory: build
        run: python3 ../scripts/coverage_badge.py coverage/coverage.info coverage/html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/html

  firmware-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (ESP-IDF v5.3.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release exists, uploading assets only"
            gh release upload "$TAG" \
              build/esp-ot-gateway.bin \
              build/bootloader/bootloader.bin \
              build/partition_table/partition-table.bin \
              --clobber -R "$GITHUB_REPOSITORY"
          else
            echo "Creating new release"
            gh release create "$TAG" \
              build/esp-ot-gateway.bin \
              build/bootloader/bootloader.bin \
              build/partition_table/partition-table.bin \
              --generate-notes \
              -R "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Single GitHub Pages deployment. Publishes the web flasher at the site root,
  # the coverage report (incl. badge.svg) under /coverage/, and per-version
  # firmware binaries + manifests under /firmware/<tag>/. Replaces the old
  # split setup where the flasher deployed via Actions but coverage was pushed
  # to an orphaned gh-pages branch (404 on /coverage/).
  deploy-pages:
    needs: [test, coverage]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: site/coverage

      - name: Assemble site (flasher at root + firmware manifests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          cp -r web-flasher/. site/
          mkdir -p site/firmware
          RELEASES=$(gh release list --limit 50 --json tagName -q '.[].tagName')
          for tag in $RELEASES; do
            DST="site/firmware/$tag"
            mkdir -p "$DST"
            gh release download "$tag" --pattern '*.bin' --dir "$DST" --clobber || echo "Skipping $tag (no assets)"
            find "$DST" -name '*.bin' -not -path "$DST/*.bin" -exec mv {} "$DST/" \; 2>/dev/null || true
            find "$DST" -type d -empty -delete 2>/dev/null || true
          done
          gen_manifest() {
            printf '{\n'
            printf '  "name": "ESP OpenTherm Gateway",\n'
            printf '  "version": "%s",\n' "$1"
            printf '  "home_url": "https://github.com/sogimu/esp-ot-gateway",\n'
            printf '  "builds": [{\n'
            printf '    "chipFamily": "ESP32",\n'
            printf '    "flashMode": "dio",\n'
            printf '    "flashSize": "2MB",\n'
            printf '    "flashFreq": "80m",\n'
            printf '    "parts": [\n'
            printf '      { "path": "bootloader.bin", "offset": 4096 },\n'
            printf '      { "path": "partition-table.bin", "offset": 32768 },\n'
            printf '      { "path": "esp-ot-gateway.bin", "offset": 65536 }\n'
            printf '    ]\n'
            printf '  }]\n'
            printf '}\n'
          }
          for tag in $RELEASES; do
            DST="site/firmware/$tag"
            if [ -f "$DST/bootloader.bin" ]; then
              gen_manifest "$tag" > "$DST/manifest.json"
            fi
          done
          echo "=== site tree ==="
          find site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
