name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Catch2
        run: sudo apt-get update && sudo apt-get install -y catch2

      - name: Configure
        run: cmake -B build -S test -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./run_tests -s

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y catch2 lcov

      - name: Configure
        run: cmake -B build -S test -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=OFF -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Generate coverage report
        working-directory: build
        run: cmake --build . --target coverage

      - name: Generate coverage badge
        working-directory: build
        run: python3 ../scripts/coverage_badge.py coverage/coverage.info coverage/html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/html

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/coverage/html
          destination_dir: coverage
          keep_files: false

  firmware-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (ESP-IDF v5.3.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release exists, uploading assets only"
            gh release upload "$TAG" \
              build/esp-ot-gateway.bin \
              build/bootloader/bootloader.bin \
              build/partition_table/partition-table.bin \
              --clobber -R "$GITHUB_REPOSITORY"
          else
            echo "Creating new release"
            gh release create "$TAG" \
              build/esp-ot-gateway.bin \
              build/bootloader/bootloader.bin \
              build/partition_table/partition-table.bin \
              --generate-notes \
              -R "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
