name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_rc:
        description: 'RC-тег, который удалить после успешного стабильного релиза'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Catch2
        run: sudo apt-get update && sudo apt-get install -y catch2

      - name: Configure
        run: cmake -B build -S test -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./run_tests -s

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y catch2 lcov

      - name: Configure
        run: cmake -B build -S test -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=OFF -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Generate coverage report
        working-directory: build
        run: cmake --build . --target coverage

      - name: Generate coverage badge
        working-directory: build
        run: python3 ../scripts/coverage_badge.py coverage/coverage.info coverage/html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/html

  firmware-build:
    runs-on: ubuntu-latest
    outputs:
      promotion_pending: ${{ steps.promo.outputs.pending }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Полный граф коммитов нужен для guard'а `merge-base --is-ancestor`.
          fetch-depth: 0

      - name: Check promotion pending
        id: promo
        run: |
          set -euo pipefail
          pending=false
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if git tag --merged "$GITHUB_SHA" -l 'v*-rc*' \
               | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$'; then
              pending=true
            fi
          fi
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Build firmware (ESP-IDF v5.3.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32

      - name: Stage firmware binaries
        run: |
          mkdir -p firmware-artifact
          cp build/esp-ot-gateway.bin firmware-artifact/
          cp build/bootloader/bootloader.bin firmware-artifact/
          cp build/partition_table/partition-table.bin firmware-artifact/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: firmware-artifact

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RC: ${{ github.event.inputs.source_rc }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          # Канал тега: vX.Y.Z — стабильный, vX.Y.Z-rcN — тестовый.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            CHANNEL=test
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=stable
          else
            echo "::error::Недопустимый формат тега: $TAG (ожидается vX.Y.Z или vX.Y.Z-rcN)"
            exit 1
          fi
          echo "Тег $TAG, канал: $CHANNEL"

          # Стабильный тег обязан быть достижим из master (guard).
          if [ "$CHANNEL" = stable ]; then
            git fetch origin master
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::Стабильный тег $TAG указывает на коммит, недостижимый из master"
              exit 1
            fi
          fi

          # actions/checkout перезаписывает локальный тег на коммит
          # (`+<sha>:refs/tags/<tag>`), делая его легковесным. Возвращаем
          # аннотированный tag-объект, иначе notes = message коммита.
          git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"

          # Notes — из аннотации тега; пустая аннотация (или совпадающая с
          # именем тега) → автогенерация. Аннотацию передаём файлом:
          # `--notes-from-tag` нельзя комбинировать с `--repo` (gh читает
          # аннотацию из локального репозитория).
          ANNOTATION="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')"
          TRIMMED="$(printf '%s' "$ANNOTATION" | tr -d '[:space:]')"
          if [ -z "$TRIMMED" ] || [ "$TRIMMED" = "$TAG" ]; then
            NOTES_ARGS=(--generate-notes)
          else
            NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes.md"
            printf '%s\n' "$ANNOTATION" > "$NOTES_FILE"
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          fi

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Релиз существует — обновляем только ассеты"
            gh release upload "$TAG" \
              build/esp-ot-gateway.bin \
              build/bootloader/bootloader.bin \
              build/partition_table/partition-table.bin \
              --clobber -R "$GITHUB_REPOSITORY"
          else
            echo "Создаём новый релиз $TAG"
            if [ "$CHANNEL" = stable ]; then
              CHANNEL_ARGS=(--latest)
            else
              CHANNEL_ARGS=(--prerelease)
            fi
            gh release create "$TAG" \
              build/esp-ot-gateway.bin \
              build/bootloader/bootloader.bin \
              build/partition_table/partition-table.bin \
              "${CHANNEL_ARGS[@]}" \
              "${NOTES_ARGS[@]}" \
              -R "$GITHUB_REPOSITORY"

            # Уборка всех rc промоутируемой версии — только после успешного
            # создания стабильного релиза (приходим сюда через workflow_dispatch).
            # Соседи выводятся из стабильного тега; rc других версий не трогаем.
            if [ "$CHANNEL" = stable ] && [ -n "${SOURCE_RC:-}" ]; then
              SIBLINGS="$(git ls-remote --tags origin "refs/tags/${TAG}-rc*" \
                          | awk '{print $2}' | sed 's#^refs/tags/##' \
                          | grep -E "^${TAG}-rc[0-9]+$" || true)"
              for RC_TAG in $SIBLINGS; do
                echo "Уборка rc: $RC_TAG"
                gh release delete "$RC_TAG" --yes -R "$GITHUB_REPOSITORY" || true
                git push origin ":refs/tags/$RC_TAG" || true
              done
            fi
          fi

  # Single GitHub Pages deployment. Publishes the web flasher at the site root,
  # the coverage report (incl. badge.svg) under /coverage/, and per-version
  # firmware binaries + manifests under /firmware/<tag>/. Runs on master pushes
  # and on release tags (tag runs publish the firmware built by the same run
  # from its artifact, so Pages is updated without waiting for a master push).
  deploy-pages:
    needs: [test, coverage, firmware-build]
    # Если на пушимом в master коммите есть достижимый -rcN, деплой сделает
    # промоушен (tag-прогон). Оба деплоя шли бы для одного коммита, а значит
    # с одинаковым pages_build_version — Pages не принимает второй артефакт
    # для того же version. Ручной workflow_dispatch деплоит всегда (recovery).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/master' &&
       !(github.event_name == 'push' && needs.firmware-build.outputs.promotion_pending == 'true'))
    # Дополнительно сериализуем деплои Pages, чтобы соседние запуски
    # (tag-раны, ручные dispatch) не переплетались.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Корень сайта (web-flasher) всегда из master: rc-тег с feature-ветки
          # не должен публиковать код ветки в прод-фронтенд. Прошивка текущего
          # тега берётся из артефакта, а не из checkout.
          ref: master

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: site/coverage

      - name: Download built firmware (tag run)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: firmware-binaries
          path: firmware-current

      - name: Assemble site (flasher at root + firmware manifests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r web-flasher/. site/
          mkdir -p site/firmware

          # На тег-ране прошивка текущего тега берётся из артефакта этого же
          # прогона — без гонки с созданием релиза.
          CURRENT_TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
            mkdir -p "site/firmware/$CURRENT_TAG"
            for f in esp-ot-gateway.bin bootloader.bin partition-table.bin; do
              if [ ! -f "firmware-current/$f" ]; then
                echo "::error::В артефакте нет $f"
                exit 1
              fi
              cp "firmware-current/$f" "site/firmware/$CURRENT_TAG/"
            done
            echo "Текущий тег: $CURRENT_TAG (бинари из артефакта)"
          fi

          RELEASES_JSON=$(gh release list --limit 50 --json tagName,name,publishedAt,isPrerelease)

          # Порядок каталога: стабильные (semver desc), затем тестовые.
          STABLE_TAGS=$(echo "$RELEASES_JSON" | jq -r '.[] | select(.isPrerelease == false) | .tagName' | sort -V -r)
          TEST_TAGS=$(echo "$RELEASES_JSON"   | jq -r '.[] | select(.isPrerelease == true)  | .tagName' | sort -V -r)
          ORDERED=$(printf '%s\n%s\n' "$STABLE_TAGS" "$TEST_TAGS" | sed '/^$/d')

          # Скачиваем .bin прошлых релизов; текущий тег уже из артефакта.
          for tag in $ORDERED; do
            [ "$tag" = "$CURRENT_TAG" ] && continue
            DST="site/firmware/$tag"
            mkdir -p "$DST"
            gh release download "$tag" --pattern '*.bin' --dir "$DST" --clobber || echo "Skipping $tag (no assets)"
            find "$DST" -name '*.bin' -not -path "$DST/*.bin" -exec mv {} "$DST/" \; 2>/dev/null || true
            find "$DST" -type d -empty -delete 2>/dev/null || true
          done

          # SHA256 раздаваемых esp-ot-gateway.bin → {tag: sha256}.
          SHAS_JSON='{}'
          for tag in $ORDERED; do
            BIN="site/firmware/$tag/esp-ot-gateway.bin"
            if [ -f "$BIN" ]; then
              SHA=$(sha256sum "$BIN" | awk '{print $1}')
              SHAS_JSON=$(echo "$SHAS_JSON" | jq -c --arg t "$tag" --arg s "$SHA" '. + {($t): $s}')
            fi
          done

          ORDERED_JSON=$(printf '%s\n' $ORDERED | jq -R . | jq -s .)

          # versions.json: tag,name,published_at,prerelease,sha256; без записи
          # для релизов, у которых нет розданного .bin.
          # ВАЖНО: строго компактный JSON (-c). Прошивка ищет в теле подстроки
          # вида "tag":"<tag>" / "sha256":"…" — pretty-print с пробелами ломает
          # проверку контрольной суммы на устройствах.
          echo "$RELEASES_JSON" | jq -c \
            --argjson shas "$SHAS_JSON" --argjson order "$ORDERED_JSON" \
            '{versions: ([ $order[] as $t | .[] | select(.tagName == $t) | {tag: .tagName, name: .name, published_at: .publishedAt, prerelease: .isPrerelease, sha256: $shas[$t]} ] | map(select(.sha256 != null)))}' \
            > site/versions.json
          if grep -q '"tag": "' site/versions.json; then
            echo "::error::versions.json не компактный — прошивка не найдёт sha256"
            exit 1
          fi
          CATALOG_SIZE=$(wc -c < site/versions.json)
          if [ "$CATALOG_SIZE" -ge 65536 ]; then
            echo "::error::versions.json ${CATALOG_SIZE} байт — превышает лимит прошивки 64 КиБ"
            exit 1
          fi

          gen_manifest() {
            printf '{\n'
            printf '  "name": "ESP OpenTherm Gateway",\n'
            printf '  "version": "%s",\n' "$1"
            printf '  "home_url": "https://github.com/sogimu/esp-ot-gateway",\n'
            printf '  "builds": [{\n'
            printf '    "chipFamily": "ESP32",\n'
            printf '    "flashMode": "dio",\n'
            printf '    "flashSize": "4MB",\n'
            printf '    "flashFreq": "80m",\n'
            printf '    "parts": [\n'
            printf '      { "path": "bootloader.bin", "offset": 4096 },\n'
            printf '      { "path": "partition-table.bin", "offset": 32768 },\n'
            printf '      { "path": "esp-ot-gateway.bin", "offset": 65536 }\n'
            printf '    ]\n'
            printf '  }]\n'
            printf '}\n'
          }
          for DST in site/firmware/*/; do
            tag="$(basename "$DST")"
            if [ -f "$DST/bootloader.bin" ]; then
              gen_manifest "$tag" > "$DST/manifest.json"
            fi
          done

          echo "=== versions.json ==="
          cat site/versions.json
          echo "=== site tree ==="
          find site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
