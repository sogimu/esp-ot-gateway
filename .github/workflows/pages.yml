name: Deploy Web Flasher to GitHub Pages
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware from Releases
        run: |
          mkdir -p web-flasher/firmware
          RELEASES=$(gh release list --limit 50 --json tagName -q '.[].tagName')
          for tag in $RELEASES; do
            echo "Downloading $tag..."
            DST="web-flasher/firmware/$tag"
            mkdir -p "$DST"
            gh release download "$tag" \
              --pattern '*.bin' \
              --dir "$DST" \
              --clobber || echo "Skipping $tag (no assets)"
            # Flatten nested paths (gh release download may preserve build/ subdirs)
            find "$DST" -name '*.bin' -not -path "$DST/*.bin" -exec mv {} "$DST/" \; 2>/dev/null || true
            find "$DST" -type d -empty -delete 2>/dev/null || true
          done
          echo "Firmware downloads complete:"
          find web-flasher/firmware -type f | sort
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'web-flasher'
      - uses: actions/deploy-pages@v4
