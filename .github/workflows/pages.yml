name: Deploy Web Flasher to GitHub Pages
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware from Releases
        run: |
          mkdir -p web-flasher/firmware
          RELEASES=$(gh release list --limit 50 --json tagName -q '.[].tagName')
          for tag in $RELEASES; do
            echo "Downloading $tag..."
            DST="web-flasher/firmware/$tag"
            mkdir -p "$DST"
            gh release download "$tag" \
              --pattern '*.bin' \
              --dir "$DST" \
              --clobber || echo "Skipping $tag (no assets)"
            # Flatten nested paths (gh release download may preserve build/ subdirs)
            find "$DST" -name '*.bin' -not -path "$DST/*.bin" -exec mv {} "$DST/" \; 2>/dev/null || true
            find "$DST" -type d -empty -delete 2>/dev/null || true
          done
          # Generate manifest.json for each version
          gen_manifest() {
            printf '{\n'
            printf '  "name": "ESP OpenTherm Gateway",\n'
            printf '  "version": "%s",\n' "$1"
            printf '  "home_url": "https://github.com/sogimu/esp-ot-gateway",\n'
            printf '  "builds": [{\n'
            printf '    "chipFamily": "ESP32",\n'
            printf '    "flashMode": "dio",\n'
            printf '    "flashSize": "2MB",\n'
            printf '    "flashFreq": "80m",\n'
            printf '    "parts": [\n'
            printf '      { "path": "bootloader.bin", "offset": 4096 },\n'
            printf '      { "path": "partition-table.bin", "offset": 32768 },\n'
            printf '      { "path": "esp-ot-gateway.bin", "offset": 65536 }\n'
            printf '    ]\n'
            printf '  }]\n'
            printf '}\n'
          }
          for tag in $RELEASES; do
            DST="web-flasher/firmware/$tag"
            if [ -f "$DST/bootloader.bin" ]; then
              echo "Generating manifest for $tag..."
              gen_manifest "$tag" > "$DST/manifest.json"
            fi
          done
          echo "Firmware downloads complete:"
          find web-flasher/firmware -type f | sort
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'web-flasher'
      - uses: actions/deploy-pages@v4
