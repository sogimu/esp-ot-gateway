<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- PCB -->
  <rect x="10" y="10" width="280" height="180" rx="6" fill="#1a3a1a" stroke="#0d1f0d" stroke-width="2"/>
  
  <!-- ESP32 module -->
  <rect x="40" y="40" width="120" height="100" rx="3" fill="#333" stroke="#222" stroke-width="1"/>
  <text x="100" y="95" text-anchor="middle" font-size="10" fill="#888" font-family="sans-serif">ESP32</text>
  
  <!-- Pin headers -->
  <rect x="20" y="30" width="12" height="8" rx="1" fill="#c4983a"/>
  <rect x="20" y="42" width="12" height="8" rx="1" fill="#c4983a"/>
  <rect x="20" y="54" width="12" height="8" rx="1" fill="#c4983a"/>
  <rect x="268" y="30" width="12" height="8" rx="1" fill="#c4983a"/>
  <rect x="268" y="42" width="12" height="8" rx="1" fill="#c4983a"/>
  <rect x="268" y="54" width="12" height="8" rx="1" fill="#c4983a"/>
  
  <!-- USB -->
  <rect x="250" y="80" width="30" height="18" rx="3" fill="#444" stroke="#222" stroke-width="1"/>
  <rect x="253" y="84" width="24" height="10" rx="1" fill="#222"/>
  <text x="265" y="74" text-anchor="middle" font-size="7" fill="#aaa" font-family="sans-serif">USB</text>
  
  <!-- BOOT button -->
  <rect x="185" y="48" width="28" height="18" rx="3" fill="#666" stroke="#444" stroke-width="1"/>
  <rect x="188" y="51" width="22" height="12" rx="1.5" fill="#999"/>
  <text x="199" y="60" text-anchor="middle" font-size="6" fill="#222" font-family="sans-serif">BOOT</text>
  
  <!-- EN button -->
  <rect x="185" y="80" width="28" height="18" rx="3" fill="#666" stroke="#444" stroke-width="1"/>
  <rect x="188" y="83" width="22" height="12" rx="1.5" fill="#999"/>
  <text x="199" y="92" text-anchor="middle" font-size="6" fill="#222" font-family="sans-serif">EN</text>
  
  <!-- Callouts -->
  <line x1="213" y1="57" x2="230" y2="48" stroke="#4fc3f7" stroke-width="1"/>
  <text x="235" y="52" font-size="8" fill="#4fc3f7" font-family="sans-serif">BOOT</text>
  
  <line x1="213" y1="89" x2="230" y2="100" stroke="#4fc3f7" stroke-width="1"/>
  <text x="235" y="104" font-size="8" fill="#4fc3f7" font-family="sans-serif">EN (RST)</text>
  
  <!-- Note -->
  <text x="150" y="170" text-anchor="middle" font-size="7" fill="#666" font-family="sans-serif">BOOT и EN есть на любой ESP32-плате. Надписи могут отличаться: BOOT/IO0, EN/RST.</text>
</svg>
