<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- PCB board -->
  <rect x="10" y="10" width="280" height="180" rx="6" fill="#1a3a1a" stroke="#0d1f0d" stroke-width="2"/>
  
  <!-- ESP32 module (metal can) -->
  <rect x="40" y="40" width="120" height="100" rx="3" fill="#333" stroke="#222" stroke-width="1"/>
  <text x="100" y="95" text-anchor="middle" font-size="11" fill="#888" font-family="sans-serif">ESP32-WROOM</text>
  
  <!-- PCB edge connector pins -->
  <rect x="20" y="30" width="12" height="8" rx="1" fill="#d4a84b"/>
  <rect x="20" y="42" width="12" height="8" rx="1" fill="#d4a84b"/>
  <rect x="20" y="54" width="12" height="8" rx="1" fill="#d4a84b"/>
  <rect x="268" y="30" width="12" height="8" rx="1" fill="#d4a84b"/>
  <rect x="268" y="42" width="12" height="8" rx="1" fill="#d4a84b"/>
  <rect x="268" y="54" width="12" height="8" rx="1" fill="#d4a84b"/>
  
  <!-- USB micro port (right side) -->
  <rect x="250" y="80" width="30" height="18" rx="3" fill="#444" stroke="#222" stroke-width="1"/>
  <rect x="253" y="84" width="24" height="10" rx="1" fill="#222"/>
  <text x="265" y="74" text-anchor="middle" font-size="7" fill="#aaa" font-family="sans-serif">USB</text>
  
  <!-- BOOT button -->
  <rect x="185" y="50" width="28" height="18" rx="3" fill="#666" stroke="#444" stroke-width="1"/>
  <rect x="188" y="53" width="22" height="12" rx="1.5" fill="#999"/>
  <text x="199" y="62" text-anchor="middle" font-size="6" fill="#222" font-family="sans-serif">BOOT</text>
  
  <!-- EN button -->
  <rect x="185" y="80" width="28" height="18" rx="3" fill="#666" stroke="#444" stroke-width="1"/>
  <rect x="188" y="83" width="22" height="12" rx="1.5" fill="#999"/>
  <text x="199" y="92" text-anchor="middle" font-size="6" fill="#222" font-family="sans-serif">EN</text>
  
  <!-- Callout lines -->
  <line x1="213" y1="59" x2="233" y2="50" stroke="#4fc3f7" stroke-width="1"/>
  <line x1="213" y1="89" x2="233" y2="100" stroke="#4fc3f7" stroke-width="1"/>
  
  <!-- Labels -->
  <text x="240" y="48" font-size="8" fill="#4fc3f7" font-family="sans-serif">Кнопка</text>
  <text x="240" y="56" font-size="8" fill="#4fc3f7" font-family="sans-serif">BOOT</text>
  <text x="240" y="98" font-size="8" fill="#4fc3f7" font-family="sans-serif">Кнопка</text>
  <text x="240" y="106" font-size="8" fill="#4fc3f7" font-family="sans-serif">EN (RST)</text>
  
  <!-- LED -->
  <circle cx="185" cy="140" r="4" fill="#006"/>
  <circle cx="185" cy="140" r="3" fill="#00f" opacity="0.6"/>
  <text x="195" y="143" font-size="6" fill="#aaa" font-family="sans-serif">LED</text>
</svg>
